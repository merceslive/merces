[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Robinhood Chain is Arbitrum Orbit (Nitro): PUSH0 / TSTORE / MCOPY work, so cancun is safe.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[rpc_endpoints]
# *.chain.robinhood.com is blocked on the user's ISP: drpc (archive, for forks) / publicnode.
robinhood = "https://robinhood-rpc.publicnode.com"
robinhood_fork = "https://robinhood.drpc.org"
robinhood_testnet = "https://robinhood-sepolia-rpc.publicnode.com"

[lint]
lint_on_build = false
