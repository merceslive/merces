server {
  listen 80;
  server_name merces.live www.merces.live;
  root /opt/merces/web/dist;
  index index.html;
  client_max_body_size 400k;

  location /api/ { proxy_pass http://127.0.0.1:8791; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Host $host; }
  location /i/   { proxy_pass http://127.0.0.1:8791; expires 365d; }
  location /assets/ { expires 365d; add_header Cache-Control "public, immutable"; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
